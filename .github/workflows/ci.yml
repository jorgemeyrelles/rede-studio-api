name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # src/test/resources/{privateKey,publicKey}.pem nunca foram
      # commitados — o .gitignore do projeto exclui *.pem/*.key de
      # propósito (protege as chaves de PRODUÇÃO, geradas por
      # generate-jwt-keys.sh), o que também pegou essas chaves de teste
      # fixas. Só existiam no disco de quem já tinha rodado os testes
      # localmente antes; um checkout novo (aqui, ou um clone fresco
      # local) não tem elas. Geradas aqui, descartáveis, nunca
      # commitadas — mesmo comando do generate-jwt-keys.sh (RSA-2048).
      - name: Generate test JWT keys
        run: |
          openssl genrsa -out src/test/resources/privateKey.pem 2048
          openssl rsa -in src/test/resources/privateKey.pem -pubout -out src/test/resources/publicKey.pem

      # Mongo/Redis/RabbitMQ como services: (não Quarkus Dev Services) —
      # `application.yml` já define um host default explícito pros três,
      # então o Dev Services nem sempre trata isso como "não configurado"
      # e pode não provisionar nada sozinho (gotcha real, documentado no
      # CLAUDE.md pra Redis/RabbitMQ; o Mongo se comportou igual num
      # runner do GitHub Actions, mesmo funcionando via Dev Services
      # localmente). Container real de verdade em vez de depender de
      # ativação implícita evita essa incerteza de vez.
      - name: Run tests
        run: ./mvnw test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # terraform.tfvars é gitignored (só local) e supre 4 variáveis sem
    # default em variables.tf (tenancy_ocid, jwt_issuer, duckdns_hostname,
    # letsencrypt_email) — sem elas, "terraform apply" fica preso
    # esperando input interativo que nunca chega num runner de CI.
    # Nenhuma delas é secret de verdade (identificadores/URLs públicos),
    # exceto tenancy_ocid, que já existe como secret (reaproveitado do
    # passo de credenciais OCI abaixo, sanitizado no passo "Set Terraform
    # variables" — TF_VAR_tenancy_ocid é lido cru pelo Terraform, sem o
    # trim automático que um arquivo ~/.oci/config ganha ao ser
    # parseado, então um espaço/quebra de linha sobrando no secret já
    # é o bastante pra OCI rejeitar como "compartment ID inválido").
    env:
      TF_VAR_jwt_issuer: ${{ vars.TF_JWT_ISSUER }}
      TF_VAR_duckdns_hostname: ${{ vars.TF_DUCKDNS_HOSTNAME }}
      TF_VAR_letsencrypt_email: ${{ vars.TF_LETSENCRYPT_EMAIL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa do histórico pra "git diff" detectar mudança de infra, abaixo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Recriar a VM (ou qualquer outro apply) a cada push, mesmo quando só
      # o código Java mudou, já causou um incidente real: cada recriação
      # forçava o Certbot a reemitir o certificado TLS, e o Let's Encrypt só
      # permite 5 emissões por domínio a cada 168h — poucos deploys seguidos
      # no mesmo dia esgotavam essa cota e a API ficava sem HTTPS (ver
      # oracle-deployment/deploy-oracle.sh). Terraform só deve rodar quando
      # os arquivos de infra realmente mudaram nesse push.
      - name: Detectar mudança de infraestrutura
        id: infra
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^oracle-deployment/terraform/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Chave dedicada à CI (nunca a pessoal de ninguém) — autorizada na VM
      # via ci_ssh_public_key (terraform/variables.tf), usada só pelo
      # deploy-oracle.sh pra reiniciar o serviço via Bastion Port Forwarding,
      # sem recriar a instância. A pública é derivada aqui em vez de viver
      # num secret/variable própria, pra não ter duas fontes de verdade.
      - name: Configurar chave SSH da CI
        env:
          CI_SSH_PRIVATE_KEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$CI_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_ci_rede_studio
          ssh-keygen -y -f ~/.ssh/id_ed25519_ci_rede_studio > ~/.ssh/id_ed25519_ci_rede_studio.pub
          echo "TF_VAR_ci_ssh_public_key=$(cat ~/.ssh/id_ed25519_ci_rede_studio.pub)" >> "$GITHUB_ENV"

      - name: Set sanitized Terraform variables
        run: |
          echo "TF_VAR_tenancy_ocid=$(printf '%s' "$OCI_CLI_TENANCY" | tr -d '[:space:]')" >> "$GITHUB_ENV"
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}

      # Mesmo modelo de autenticação já usado localmente (~/.oci/config,
      # API Key) — só que com uma identidade própria da CI
      # (github-actions-ci), não a credencial pessoal de ninguém. Ver
      # security.md pro passo a passo de como essa identidade foi criada.
      - name: Configure OCI credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          mkdir -p ~/.oci
          umask 077
          printf '%s' "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          tenancy=$OCI_CLI_TENANCY
          fingerprint=$OCI_CLI_FINGERPRINT
          region=$OCI_CLI_REGION
          key_file=~/.oci/oci_api_key.pem
          EOF
          pip install --user oci-cli

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: oracle-deployment/terraform
        run: terraform init

      # Sem -replace -- o próprio Terraform decide o que precisa mudar (só
      # recria a instância se o cloud-init realmente mudou, via
      # replace_triggered_by em compute.tf). Só roda quando este push
      # tocou oracle-deployment/terraform/ (passo "Detectar mudança de
      # infraestrutura" acima) -- uma atualização de código sozinha nunca
      # chega aqui.
      - name: Terraform apply (infraestrutura)
        if: steps.infra.outputs.changed == 'true'
        working-directory: oracle-deployment/terraform
        run: terraform apply -auto-approve

      # Reaproveita o script existente (já testado manualmente) em vez de
      # duplicar a lógica de build+upload+restart em YAML. Roda sempre --
      # se o passo acima acabou de recriar a VM, o cloud-init dela já
      # baixa o JAR mais recente sozinho; se não, este script builda, sobe
      # o artefato novo e reinicia o serviço via SSH (sem tocar na VM).
      - name: Build, upload and deploy
        run: bash oracle-deployment/deploy-oracle.sh

      - name: Smoke test
        run: |
          curl --fail --retry 10 --retry-delay 15 --retry-connrefused \
            https://rede-studio-api.duckdns.org/q/health/live
