name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # MongoDB roda via Quarkus Dev Services (Testcontainers) — o runner
      # do GitHub Actions já vem com Docker instalado, nenhuma config
      # extra necessária. Redis/RabbitMQ acima são containers reais
      # porque application.yml já define um host default explícito pros
      # dois, então o Dev Services não os trata como "não configurados"
      # e não os provisiona sozinho (gotcha documentado no CLAUDE.md).
      - name: Run tests
        run: ./mvnw test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Mesmo modelo de autenticação já usado localmente (~/.oci/config,
      # API Key) — só que com uma identidade própria da CI
      # (github-actions-ci), não a credencial pessoal de ninguém. Ver
      # security.md pro passo a passo de como essa identidade foi criada.
      - name: Configure OCI credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          mkdir -p ~/.oci
          umask 077
          printf '%s' "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          tenancy=$OCI_CLI_TENANCY
          fingerprint=$OCI_CLI_FINGERPRINT
          region=$OCI_CLI_REGION
          key_file=~/.oci/oci_api_key.pem
          EOF
          pip install --user oci-cli

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: oracle-deployment/terraform
        run: terraform init

      # Reaproveita o script existente (já testado manualmente) em vez
      # de duplicar a lógica de build+upload+apply em YAML.
      - name: Build, upload and deploy
        run: bash oracle-deployment/deploy-oracle.sh

      - name: Smoke test
        run: |
          curl --fail --retry 10 --retry-delay 15 --retry-connrefused \
            https://rede-studio-api.duckdns.org/q/health/live
