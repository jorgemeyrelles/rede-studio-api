worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------
    #  Logging
    # ------------------------------------------------------------------
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # Oculta versão do Nginx nos headers e páginas de erro
    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Resolver DNS interno do Docker — necessário para upstream por nome de container
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip — comprime respostas JSON e texto
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain
                      application/json
                      application/javascript
                      text/css
                      text/xml;

    # ------------------------------------------------------------------
    #  Rate limiting — zonas por IP
    # ------------------------------------------------------------------
    # Auth: 5 req/min — proteção contra brute-force em login/registro
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;

    # API geral: 60 req/min por IP
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

    # ------------------------------------------------------------------
    #  Upstream — API Quarkus
    # ------------------------------------------------------------------
    upstream quarkus_api {
        server rede-studio-api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ------------------------------------------------------------------
        #  Security headers
        # ------------------------------------------------------------------
        add_header X-Frame-Options        "DENY"           always;
        add_header X-Content-Type-Options "nosniff"        always;
        add_header X-XSS-Protection       "1; mode=block"  always;
        add_header Referrer-Policy        "strict-origin"  always;
        add_header Permissions-Policy     "geolocation=()" always;

        # ------------------------------------------------------------------
        #  /api/auth/* — rate limit estrito (brute-force protection)
        # ------------------------------------------------------------------
        location /api/auth/ {
            limit_req        zone=auth_zone burst=3 nodelay;
            limit_req_status 429;

            proxy_pass             http://quarkus_api;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       Connection        "";
            proxy_read_timeout     30s;
            proxy_connect_timeout  5s;
        }

        # ------------------------------------------------------------------
        #  /api/* — endpoints protegidos, rate limit padrão
        # ------------------------------------------------------------------
        location /api/ {
            limit_req        zone=api_zone burst=20 nodelay;
            limit_req_status 429;

            proxy_pass             http://quarkus_api;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       Connection        "";
            proxy_read_timeout     60s;
            proxy_connect_timeout  5s;
        }

        # ------------------------------------------------------------------
        #  /q/* — endpoints Quarkus (health, metrics, swagger-ui)
        #  Sem rate limit — acesso interno e ferramentas de dev
        # ------------------------------------------------------------------
        location /q/ {
            proxy_pass             http://quarkus_api;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       Connection        "";
        }

        # Rejeita qualquer outro path
        location / {
            return 404 '{"status":404,"error":"NOT_FOUND","message":"Resource not found"}';
            add_header Content-Type application/json always;
        }
    }
}
