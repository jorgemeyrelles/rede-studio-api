# =============================================================
#  Test profile overrides — aplicado exclusivamente em mvn test
# =============================================================

# MongoDB — Dev Services (Testcontainers) ativa automaticamente
# quando connection-string aponta para localhost (padrão do base yml).
# Retryable writes exigem replica set — desabilitado para standalone Dev Services.
quarkus.mongodb.write-concern.retry-writes=false
quarkus.mongodb.database=rede_studio_test

# JWT — chaves de teste no classpath (src/test/resources/)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://redestudio.test
smallrye.jwt.sign.key.location=privateKey.pem
app.jwt.issuer=https://redestudio.test
app.jwt.expiration-seconds=86400
app.jwt.private-key-location=privateKey.pem

# Admin do StartupRunner para o ambiente de teste
app.admin.email=admin@test.local
app.admin.username=testadmin
app.admin.password=TestAdmin@123!
